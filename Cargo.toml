[workspace]
members = [
  "src-tauri",
  "crates/net",
  "crates/web",
  "crates/calendar-sync",
  "crates/window-kit",
  "crates/is-screen-sharing",
  "crates/files",
  "crates/terminal",
  "packages/sync/p2p",
  "apps/installer/src-tauri",
]
resolver = "3"

[workspace.dependencies]
atrix-net = { version = "0.1.0", path = "crates/net" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", default-features = false, features = ["sync"] }

[profile.dev.package.memchr]
opt-level = 3
