[package]
name = "atrix"
version = "0.4.23"
description = "Atrix"
authors = ["ArixLab"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91"


[lib]
name = "atrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
which = "8.0.6"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-oauth = "2.1.0"
toml = "1.2.1"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tauri-plugin-log = "2.10.2"
turso = { version = "0.8.3", features = ["sync"] }
turso_parser = "0.8.3"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
keyring = "4.2.0"
twilight-gateway = { version = "0.18.0", default-features = false, features = ["rustls-platform-verifier"] }
twilight-http = "0.18.0"
twilight-model = "0.18.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"
tar = "0.4.46"
bzip2 = "0.6.1"
atrix-net = { workspace = true, features = ["tls-aws-lc-rs", "portmapper"] }
tokio = { workspace = true, features = ["time", "net"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags", "process-group"] }
tempfile = "3.27.0"
base64 = "0.23.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[target."cfg(windows)".dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
