[package]
name = "atrix"
version = "0.4.24"
description = "Atrix"
authors = ["ArixLab"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91"


[lib]
name = "atrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
which = "8.0.6"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-oauth = "2.1.0"
toml = "1.2.1"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tauri-plugin-log = "2.10.2"
turso_parser = "0.8.3"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
keyring = "4.2.0"
twilight-gateway = { version = "0.18.0", default-features = false, features = ["rustls-platform-verifier"] }
twilight-http = "0.18.0"
twilight-model = "0.18.0"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"
tar = "0.4.46"
bzip2 = "0.6.1"
atrix-net = { workspace = true, features = ["tls-aws-lc-rs", "portmapper"] }
tokio = { workspace = true, features = ["time", "net"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "creation-flags", "process-group"] }
tempfile = "3.27.0"
base64 = "0.23.1"
memchr = "2.8.3"
turso = "0.8.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-atrix-files = { version = "0.1.0", path = "../crates/files" }
tauri-plugin-barcode-scanner = "2.5.3"
tauri-plugin-calendar-sync = { version = "0.1.0", path = "../crates/calendar-sync" }

[target."cfg(windows)".dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
diesel = { version = "2.3.14", default-features = false, features = ["sqlite"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
is-screen-sharing = { version = "0.1.0", path = "../crates/is-screen-sharing" }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
log = "0.4"
roxmltree = "0.21.1"
rustfft = "6.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Foundation_Collections", "Media_Control", "Networking_Connectivity", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.3"
windows-core = "0.62"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
atrix-window-kit = { version = "0.1.0", path = "../crates/window-kit" }
tauri-plugin-atrix-files = { version = "0.1.0", path = "../crates/files" }
tauri-plugin-atrix-terminal = { version = "0.1.0", path = "../crates/terminal" }
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "2"
