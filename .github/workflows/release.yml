name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: atrix-windows
          cache-on-failure: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules/.vite
            .svelte-kit
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
          updaterJsonPreferNsis: true
          tagName: ${{ needs.version.outputs.version }}
          releaseName: Atrix ${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p apps/installer/src-tauri/payload
          cp "target/release/bundle/nsis/Atrix_${VERSION}_x64-setup.exe" apps/installer/src-tauri/payload/atrix.exe
          (cd apps/installer && bun run tauri build --no-bundle)
          cp target/release/atrix-installer.exe "Atrix_${VERSION}_x64-installer.exe"
          gh release upload "$VERSION" "Atrix_${VERSION}_x64-installer.exe" --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    needs: [version, windows]
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: atrix-linux
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ needs.version.outputs.version }}
          releaseName: Atrix ${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false

      - name: Build installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p apps/installer/src-tauri/payload
          cp "target/release/bundle/appimage/Atrix_${VERSION}_amd64.AppImage" apps/installer/src-tauri/payload/atrix.AppImage
          (cd apps/installer && bun run tauri build --bundles appimage)
          installer=$(find target/release/bundle/appimage -maxdepth 1 -iname '*installer*.AppImage' | head -n 1)
          cp "$installer" "Atrix_${VERSION}_amd64-installer.AppImage"
          gh release upload "$VERSION" "Atrix_${VERSION}_amd64-installer.AppImage" --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    needs: [version, linux]
    if: needs.version.outputs.released == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: . -> target
          shared-key: atrix-macos
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ needs.version.outputs.version }}
          releaseName: Atrix ${{ needs.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false

      - name: Build installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p apps/installer/src-tauri/payload
          cp target/release/bundle/macos/Atrix.app.tar.gz apps/installer/src-tauri/payload/atrix.app.tar.gz
          (cd apps/installer && bun run tauri build --bundles dmg)
          installer=$(find target/release/bundle/dmg -maxdepth 1 -iname '*installer*.dmg' | head -n 1)
          cp "$installer" "Atrix_${VERSION}_aarch64-installer.dmg"
          gh release upload "$VERSION" "Atrix_${VERSION}_aarch64-installer.dmg" --clobber --repo "$GITHUB_REPOSITORY"

  android:
    needs: [version, windows]
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: atrix-android
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Write signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > src-tauri/gen/android/key.properties

      - name: Build APK
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" bun run tauri android build --apk --target aarch64

      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Atrix_${VERSION}_android-arm64.apk"
          gh release upload "$VERSION" "Atrix_${VERSION}_android-arm64.apk" --clobber --repo "$GITHUB_REPOSITORY"
