[default]
description = "Run shells and serial ports in terminal sessions and move their tabs between windows."
permissions = [
  "allow-spawn",
  "allow-write",
  "allow-resize",
  "allow-kill",
  "allow-attach",
  "allow-detach",
  "allow-shells",
  "allow-serial-ports",
  "allow-take-intent",
  "allow-new-window",
  "allow-register-host",
  "allow-tear-off",
  "allow-drag-hover",
]
