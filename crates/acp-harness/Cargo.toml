[package]
name = "acp-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.11"
hex = "0.4.3"
reqwest = "0.13.5"
serde.workspace = true
serde-saphyr = "2.2.0"
serde_json.workspace = true
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { workspace = true, features = ["fs", "rt"] }
toml = "1.2.1"
walkdir = "2.5.0"
which = "8.0.6"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
